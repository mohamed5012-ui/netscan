name: بناء تطبيق الأندرويد (APK)

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: بناء الـ APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      # لوج الفشل بيتنشر في فرع عشان أقدر أقرأه من جلسة التطوير
      - name: نشر لوج الفشل
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs
          grep -nE "^e: |error:|ERROR|FAILURE|What went wrong|Caused by" -A4 "$RUNNER_TEMP/build.log" \
            | head -400 > /tmp/logs/errors.txt || true
          tail -c 200000 "$RUNNER_TEMP/build.log" > /tmp/logs/build.log || true
          cd /tmp/logs
          git init -q
          git checkout -q -b bin-log
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bin-log || true

      - name: فحص الملف الناتج
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          echo "--- حجم ---"; du -h "$APK"
          # لازم يكون من غير أي مكتبات أصلية (وده اللي بيمنع مشكلة صفحات 16KB)
          echo "--- native libs (المفروض فاضي) ---"
          unzip -l "$APK" | grep -c '^.*lib/' || echo "0 native libs"

      - name: نشر الـ APK في فرع bin-apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/netscan.apk
          cd /tmp/out
          git init -q
          git checkout -q -b bin-apk
          git add netscan.apk
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "apk build"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bin-apk

      - uses: actions/upload-artifact@v4
        with:
          name: netscan-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
