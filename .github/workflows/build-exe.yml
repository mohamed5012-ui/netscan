name: بناء ملف الويندوز (EXE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install pyinstaller openpyxl

      - name: نسخ المحرّك وقاعدة الشركات بجانب الواجهة
        shell: bash
        run: |
          cp core/scanner.py desktop/scanner.py
          cp core/vendors.gz desktop/vendors.gz
          ls -la desktop/

      - name: بناء الـ EXE
        working-directory: desktop
        run: >
          pyinstaller --onefile --windowed --name netscan
          --add-data "vendors.gz;."
          --hidden-import openpyxl
          app.py

      - name: نشر الـ EXE في فرع bin-win
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out
          cp desktop/dist/netscan.exe /tmp/out/netscan.exe
          cd /tmp/out
          git init -q
          git checkout -q -b bin-win
          git add netscan.exe
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "exe build"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bin-win

      - name: رفع الملف الناتج (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: netscan-windows-exe
          path: desktop/dist/netscan.exe
          if-no-files-found: error
